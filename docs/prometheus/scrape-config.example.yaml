# Prometheus 抓取 Memory Service 示例
# 复制到 prometheus.yml 的 scrape_configs，或 include 本文件。
#
# 前置：bootstrap.yaml 中 metrics_enabled: true

global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: memory-service
    metrics_path: /metrics
    scrape_interval: 15s
    scrape_timeout: 10s
    static_configs:
      - targets:
          - memory-api:8000
        labels:
          service: memory
          env: production

  # 本地开发（API 监听 127.0.0.1:8000）
  - job_name: memory-service-local
    metrics_path: /metrics
    static_configs:
      - targets:
          - 127.0.0.1:8000
        labels:
          service: memory
          env: development

